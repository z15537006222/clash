[custom]

; 基于 ACL4SSR Online Mini，仅增加 AI 分流组。
; AI 规则放在其他代理规则之前，确保 OpenAI/Antigravity 不被普通规则抢先匹配。
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 国内直连,[]DOMAIN,www.zvip.cloud

; OpenAI 官方及 Codex 相关域名
ruleset=♻️ AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=♻️ AI,[]DOMAIN-SUFFIX,openai.com
ruleset=♻️ AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=♻️ AI,[]DOMAIN-SUFFIX,oaistatic.com

; Antigravity、Cloud Code、认证、Google Play 及 Playwright 下载域名
ruleset=♻️ AI,[]DOMAIN-SUFFIX,antigravity.google
ruleset=♻️ AI,[]DOMAIN-SUFFIX,antigravity.google.com
ruleset=♻️ AI,[]DOMAIN-KEYWORD,antigravity
ruleset=♻️ AI,[]DOMAIN,daily-cloudcode-pa.googleapis.com
ruleset=♻️ AI,[]DOMAIN,cloudcode-pa.googleapis.com
ruleset=♻️ AI,[]DOMAIN,daily-cloudcode-pa.sandbox.googleapis.com
ruleset=♻️ AI,[]DOMAIN,oauth2.googleapis.com
ruleset=♻️ AI,[]DOMAIN,play.googleapis.com
ruleset=♻️ AI,[]DOMAIN,playwright.azureedge.net
ruleset=♻️ AI,[]DOMAIN,playwright-akamai.azureedge.net
ruleset=♻️ AI,[]DOMAIN,playwright-verizon.azureedge.net

; TikTok：实际加载 TikTok 首页抓到的 tiktok.com、tiktokv.com、
; tiktokcdn.com 和 ttwstatic.com，以及维护中的 TikTok 官方相关域名集合。
ruleset=♻️ AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
ruleset=♻️ AI,[]DOMAIN-SUFFIX,ttwstatic.com

; IP138 首页及其脚本实际涉及的域名
ruleset=♻️ AI,[]DOMAIN-SUFFIX,ip138.com
ruleset=♻️ AI,[]DOMAIN,hm.baidu.com
ruleset=♻️ AI,[]DOMAIN,api.map.baidu.com
ruleset=♻️ AI,[]DOMAIN,report.ipchaxun.com
ruleset=♻️ AI,[]DOMAIN,beian.miit.gov.cn

ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 国内直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

custom_proxy_group=🚀 节点选择`select`.*
custom_proxy_group=♻️ AI`select`^.*(软银-Jp to Usa|圣何塞-shs-usa)$
custom_proxy_group=🎯 国内直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]软银-Jp`[]软银-Jp to Usa`[]圣何塞-shs`[]圣何塞-shs-usa`[]🎯 国内直连

enable_rule_generator=true
overwrite_original_rules=true
