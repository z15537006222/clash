[custom]

# OpenAI 官方/相关域名与 IP 规则；其中包含 DOMAIN、DOMAIN-SUFFIX、
# DOMAIN-KEYWORD、IP-CIDR 和 IP-ASN 规则。
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list

# OpenAI 官方域名：覆盖 Codex 官方 API、登录认证、ChatGPT 后端及静态资源。
# 不包含用户自定义的 www.zvip.cloud；该地址按你的要求保持直连。
ruleset=AI,[]DOMAIN-SUFFIX,openai.com
ruleset=AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=AI,[]DOMAIN-SUFFIX,oaistatic.com

# Antigravity：覆盖产品相关域名，以及本次 CLI 实测/日志确认的 API、认证、遥测
# 和 Playwright 下载入口。它们最终解析到 Google/Azure Edge 共享 CDN，不直接写 IP。
ruleset=AI,[]DOMAIN-SUFFIX,antigravity.google
ruleset=AI,[]DOMAIN-SUFFIX,antigravity.google.com
ruleset=AI,[]DOMAIN-KEYWORD,antigravity
ruleset=AI,[]DOMAIN,daily-cloudcode-pa.googleapis.com
ruleset=AI,[]DOMAIN,cloudcode-pa.googleapis.com
ruleset=AI,[]DOMAIN,daily-cloudcode-pa.sandbox.googleapis.com
ruleset=AI,[]DOMAIN,oauth2.googleapis.com
ruleset=AI,[]DOMAIN,play.googleapis.com
ruleset=AI,[]DOMAIN,playwright.azureedge.net
ruleset=AI,[]DOMAIN,playwright-akamai.azureedge.net
ruleset=AI,[]DOMAIN,playwright-verizon.azureedge.net

# 中国域名、中国 IP、局域网地址直连。
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🎯 全球直连,[]GEOIP,LAN

# GeoData 标记为非中国的域名统一使用普通 JP 节点。
# GEOIP,!CN 不是 Mihomo 的有效反向 GEOIP 写法，因此这里使用
# GeoSite 的 geolocation-!cn 分类。
ruleset=🌍 国外网站,[]GEOSITE,geolocation-!cn

# 未命中前面规则的流量按普通国外网站处理，避免普通国外网站漏走直连。
ruleset=🌍 国外网站,[]FINAL

# OpenAI 和 Antigravity 共用 AI 组：只包含两条 USA 出口节点。
custom_proxy_group=AI`select`[]AI自动选择`^(软银-Jp to Usa|圣何塞-shs-usa)$
custom_proxy_group=AI自动选择`url-test`^(软银-Jp to Usa|圣何塞-shs-usa)$`http://www.gstatic.com/generate_204`300,,50

# 普通国外网站专用组：只包含两条普通 JP 节点。
custom_proxy_group=🌍 国外网站`select`[]🌍 国外自动选择`^(软银-Jp|圣何塞-shs)$
custom_proxy_group=🌍 国外自动选择`url-test`^(软银-Jp|圣何塞-shs)$`http://www.gstatic.com/generate_204`300,,50

# 直连组不包含任何代理节点。
custom_proxy_group=🎯 全球直连`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
