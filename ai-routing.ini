[custom]

; 基于 ACL4SSR Online Mini，增加海外 AI、YouTuBe 和 TikTok 专用分流组。
; 中国 AI 优先直连，专用规则放在普通代理及中国 IP 规则之前。
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 国内直连,[]DOMAIN,www.zvip.cloud

; 指定域名及其所有子域名优先直连。
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,009977.xyz
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,4jianjian.shop

; 中国 AI（包括中国厂商的国际版）优先直连，避免被海外 AI 或 TikTok 列表覆盖。
ruleset=🎯 国内直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-ai-cn.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/bytedance-ai-!cn.list
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,kimi.ai
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,moonshot.ai
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,minimax.io
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,qoder.com

; 海外 AI 汇总：OpenAI、Claude、Gemini、Copilot、Cursor、Grok、Perplexity 等。
; 使用可直接供 subconverter 读取的 classical 格式；中国 AI 由上面的规则优先排除。
ruleset=♻️ AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-ai-!cn.list
; 补充普通海外媒体列表中的 AI 专用域名。
ruleset=♻️ AI,[]DOMAIN-SUFFIX,ai.azure.com
ruleset=♻️ AI,[]DOMAIN-SUFFIX,together.ai
ruleset=♻️ AI,[]DOMAIN-SUFFIX,together.xyz
ruleset=♻️ AI,[]DOMAIN,sydney.bing.com

; OpenAI 官方及 Codex 相关域名
ruleset=♻️ AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=♻️ AI,[]DOMAIN-SUFFIX,openai.com
ruleset=♻️ AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=♻️ AI,[]DOMAIN-SUFFIX,oaistatic.com

; Antigravity、Cloud Code、认证、Google Cloud 管理、Google Play 及 Playwright 下载域名
ruleset=♻️ AI,[]DOMAIN-SUFFIX,antigravity.google
ruleset=♻️ AI,[]DOMAIN-SUFFIX,antigravity.google.com
ruleset=♻️ AI,[]DOMAIN-KEYWORD,antigravity
ruleset=♻️ AI,[]DOMAIN,daily-cloudcode-pa.googleapis.com
ruleset=♻️ AI,[]DOMAIN,cloudcode-pa.googleapis.com
ruleset=♻️ AI,[]DOMAIN,daily-cloudcode-pa.sandbox.googleapis.com
ruleset=♻️ AI,[]DOMAIN,oauth2.googleapis.com
ruleset=♻️ AI,[]DOMAIN,www.googleapis.com
ruleset=♻️ AI,[]DOMAIN,cloudresourcemanager.googleapis.com
ruleset=♻️ AI,[]DOMAIN,serviceusage.googleapis.com
ruleset=♻️ AI,[]DOMAIN,play.googleapis.com
ruleset=♻️ AI,[]DOMAIN,playwright.azureedge.net
ruleset=♻️ AI,[]DOMAIN,playwright-akamai.azureedge.net
ruleset=♻️ AI,[]DOMAIN,playwright-verizon.azureedge.net

; YouTube 网页、视频、图片、API、音乐及规则源维护的 IPv4/IPv6 网段。
; 放在普通海外规则之前，确保 YouTube 独立选择出口。
ruleset=YouTuBe,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=YouTuBe,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTubeMusic/YouTubeMusic.list

; TikTok：实际加载 TikTok 首页抓到的 tiktok.com、tiktokv.com、
; tiktokcdn.com 和 ttwstatic.com，以及维护中的 TikTok 官方相关域名集合。
ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
ruleset=🎵 TikTok,[]DOMAIN-SUFFIX,ttwstatic.com

; IP138 首页及其脚本实际涉及的域名
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,ip138.com
ruleset=🎯 国内直连,[]DOMAIN,hm.baidu.com
ruleset=🎯 国内直连,[]DOMAIN,api.map.baidu.com
ruleset=🎯 国内直连,[]DOMAIN,report.ipchaxun.com
ruleset=🎯 国内直连,[]DOMAIN,beian.miit.gov.cn

; 在线工具网 tool.hiofd.com 首页实际涉及的域名
ruleset=♻️ AI,[]DOMAIN-SUFFIX,hiofd.com
ruleset=♻️ AI,[]DOMAIN,pagead2.googlesyndication.com
ruleset=♻️ AI,[]DOMAIN,googleads.g.doubleclick.net
ruleset=♻️ AI,[]DOMAIN,ep1.adtrafficquality.google
ruleset=♻️ AI,[]DOMAIN,ep2.adtrafficquality.google

ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 国内直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

custom_proxy_group=🚀 节点选择`select`.*
custom_proxy_group=♻️ AI`select`.*
custom_proxy_group=YouTuBe`select`.*
custom_proxy_group=🎵 TikTok`select`.*
custom_proxy_group=🎯 国内直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`.*`[]🎯 国内直连

enable_rule_generator=true
overwrite_original_rules=true
